<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Recording player · Academy</title>
  <link rel="stylesheet" href="/css/m4l-lesson-media.css?v=107.66-session-video-1">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f8f5fa;color:#302735;font:16px/1.5 system-ui,sans-serif}main{max-width:960px;margin:40px auto;padding:24px}header{margin-bottom:24px}.eyebrow{color:#754980;font-weight:650;font-size:13px;letter-spacing:.08em;text-transform:uppercase}h1{font:500 34px/1.2 Georgia,serif;margin:8px 0}header p{color:#6c6172;margin:8px 0}.preview-card{padding:24px;border:1px solid #dfd1e6;border-radius:16px;background:#fff;box-shadow:0 8px 30px #33203908}form{display:grid;gap:10px}label{font-weight:600}input{font:inherit;padding:12px;border:1px solid #cdbbd5;border-radius:8px;width:100%;min-width:0}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button{font:600 15px system-ui;padding:12px 20px;border:0;border-radius:8px;background:#754980;color:white;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b194bd;outline-offset:3px}.help{font-size:14px;color:#6c6172;margin:0}#player-area{margin-top:24px}.lm-player{display:block;max-height:65vh}#status{min-height:24px;font-size:14px;color:#65446f}#status[role=alert]{color:#a82c3c}[hidden]{display:none!important}@media(max-width:600px){main{margin:12px auto;padding:14px}.preview-card{padding:16px}h1{font-size:28px}}
  </style>
</head>
<body>
<main>
  <header><span class="eyebrow">Academy · Local preview</span><h1>Recording player</h1><p>Try a Zoom-hosted recording or a YouTube video inside the app.</p></header>
  <section class="preview-card">
    <form id="video-form">
      <label for="video-address">Video address</label>
      <input id="video-address" type="url" autocomplete="off" spellcheck="false" required placeholder="Paste a video address">
      <p class="help">Zoom playback needs the recording’s direct MP4 address. A Zoom sharing page opens in Zoom.</p>
      <div class="actions"><button type="submit">Open video</button><span class="help">Preview only · no file is uploaded or saved</span></div>
    </form>
    <p id="status" role="status" aria-live="polite">Ready to try a recording.</p>
    <section id="player-area" aria-label="Recording player" hidden></section>
  </section>
</main>
<script src="/js/m4l-video-preview.js?v=1"></script>
</body>
</html>
