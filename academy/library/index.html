<!doctype html>
<html lang="en">
<head>
<script src="/js/m4l-academy-workspace.js?v=107.84"></script><script src="/js/m4l-academy-read-cache.js?v=107.84"></script><script src="/js/m4l-academy-admin-menu.js?v=107.84"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Academy Library</title>
  <link rel="stylesheet" href="/css/m4l-academy-library.css?v=107.52">
  <link rel="stylesheet" href="/css/m4l-academy-navigation.css?v=106.11">
<link rel="stylesheet" href="/css/m4l-academy-mobile.css?v=107.57">
<link rel="stylesheet" href="/css/m4l-academy-page-actions.css?v=107.57">
<link rel="stylesheet" href="/css/m4l-academy-shell.css?v=107.84">
<link rel="stylesheet" href="/css/m4l-academy-mobile-first.css?v=mobile-first.1">
</head>
<body>
  <header class="al-header"><a href="/academy/#overview">← My Academy</a><strong>Academy Library</strong><a id="al-manage-books" href="/academy/library/manage/" hidden>Manage Library</a></header>
  <main class="al-main">
    <div class="al-intro"><div class="library-title-row"><h1>Library</h1><button type="button" id="al-refresh" class="library-refresh" aria-label="Refresh Library" title="Refresh Library" data-page-content-refresh>↻</button></div></div>

    <nav class="al-tabs" aria-label="Library view"><a href="/academy/library/" aria-current="page">This course</a><a href="/academy/open-library/">Public library</a><a href="/academy/pdf-reader/?bookmarks=1">Bookmarks</a></nav>
    <p id="al-status" role="status" aria-live="polite">Checking your Library access…</p>
    <div id="al-content" hidden>
      <div class="al-filters"><label>Search<input id="al-search" type="search" placeholder="Title, subject or source"></label><label>Source<select id="al-source"><option value="ALL">All sources</option></select></label></div>
      <div id="al-categories" class="library-category-pills" role="group" aria-label="Filter by category"><button type="button" data-category="ALL" aria-pressed="true">All</button><button type="button" data-category="PDF" aria-pressed="false">PDF</button><button type="button" data-category="AUDIOVISUAL" aria-pressed="false">AudioVisual</button><button type="button" data-category="OTHER" aria-pressed="false">Other</button></div>
      <div id="al-results" aria-live="polite"></div>
    </div>
  </main>
  <dialog id="al-preview" aria-labelledby="al-preview-title"><div class="al-preview-head"><div><small id="al-preview-source"></small><h2 id="al-preview-title"></h2></div><button id="al-close" type="button" aria-label="Close resource">✕</button></div><p id="al-preview-details"></p><div id="al-volume-wrap" class="al-volume" hidden><label id="al-volume-label" for="al-volume">Volume</label><select id="al-volume"></select></div><p id="al-preview-status" role="status" aria-live="polite"></p><div id="al-media"></div><a id="al-open" target="_blank" rel="noopener noreferrer" hidden>Open file in new tab ↗</a></dialog>
  <script src="/js/m4l-config.js?v=107.52"></script>
  <script src="/js/m4l-library-cache.js?v=107.54"></script>
  <script src="/js/m4l-personal-links.js?v=107.52"></script>
  <script src="/js/m4l-academy-library.js?v=107.54"></script>
  <script src="/js/m4l-academy-navigation.js?v=107.84"></script>
<script src="/js/m4l-academy-mobile.js?v=mobile-first.1"></script><script src="/js/m4l-academy-contents.js?v=mobile-first.1"></script>
<script src="/js/m4l-library-menu.js?v=107.52"></script>
<script src="/js/m4l-academy-page-actions.js?v=107.57"></script>
</body>
</html>
