<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PDF reader · Umm Abbad Academy</title><link rel="icon" href="/admin-favicon-32x32.png"><link rel="stylesheet" href="/css/m4l-academy-navigation.css?v=106.11"><link rel="stylesheet" href="/css/m4l-academy-mobile.css?v=106.52"><link rel="stylesheet" href="/css/m4l-academy-page-actions.css?v=106.52"><link rel="stylesheet" href="/css/m4l-academy-shell.css?v=107.3"><link rel="stylesheet" href="/css/m4l-pdf-reader.css?v=107.15"><link rel="stylesheet" href="/css/m4l-pdf-whiteboard.css?v=107.13"></head><body class="pr-body"><header class="pr-header"><a class="pr-brand" href="/academy/#overview"><img src="/ummabbadacademy.png" alt=""><span>Umm Abbad Academy<small>PDF reader · V107.19</small></span></a><nav aria-label="Reader actions"><button id="pr-split" type="button" aria-pressed="false">Split Page</button><button id="m4l-teaching-panel-toggle" type="button" aria-expanded="false" aria-controls="m4l-teaching-panel">Whiteboard</button><button id="pr-fullscreen" type="button" aria-pressed="false" aria-label="Full screen: hide Academy headers">Full screen</button><button id="pr-both" type="button" aria-pressed="false" hidden>Show both</button></nav><a id="pr-close-reader" class="pr-close-reader" href="/academy/open-library/" aria-label="Close PDF reader and return to Library" title="Close and return to Library"><span aria-hidden="true">×</span></a></header><div class="pr-tabs" id="pr-tabs" role="tablist" aria-label="Choose PDF" hidden><button id="pr-tab-0" type="button" role="tab" aria-selected="true" aria-controls="pr-pane-0" tabindex="0">PDF 1</button><button id="pr-tab-1" type="button" role="tab" aria-selected="false" aria-controls="pr-pane-1" tabindex="-1">PDF 2</button></div><p id="pr-status" role="status" aria-live="polite">Loading PDF defaults…</p><div id="m4l-pdf-teaching-workspace" class="m4l-pdf-teaching-workspace"><main id="pr-workspace" class="pr-workspace"><section id="pr-pane-0" class="pr-pane is-active" aria-label="PDF 1"></section><div id="pr-divider" class="pr-divider" role="separator" aria-label="Resize PDF panes" aria-orientation="vertical" aria-valuemin="20" aria-valuemax="80" aria-valuenow="50" tabindex="0" hidden></div><section id="pr-pane-1" class="pr-pane" aria-label="PDF 2" hidden></section></main>        <div
          id="m4l-teaching-panel-divider"
          class="m4l-teaching-panel-divider"
          role="separator"
          aria-orientation="vertical"
          aria-label="Resize whiteboard"
          tabindex="0"
          hidden
        ></div>

        <aside
          id="m4l-teaching-panel"
          class="m4l-teaching-panel"
          aria-label="Whiteboard"
          aria-hidden="true"
          hidden
        >
          <header class="m4l-teaching-panel-header">
            <button
              type="button"
              class="m4l-teaching-panel-close"
              data-m4l-whiteboard-action="close"
              aria-label="Close whiteboard"
              title="Close"
            >
              <span aria-hidden="true">×</span>
            </button>
            <h3>Whiteboard</h3>
            <button
              type="button"
              class="m4l-teaching-panel-clear"
              data-m4l-whiteboard-action="clearActive"
            >Clear</button>
          </header>

          <div class="m4l-teaching-panel-tabs" role="tablist" aria-label="Whiteboard modes">
            <button
              id="m4l-teaching-drawing-tab"
              type="button"
              class="m4l-teaching-tab is-active"
              role="tab"
              aria-selected="true"
              aria-controls="m4l-teaching-drawing-view"
              data-m4l-teaching-tab="drawing"
            >Drawing</button>
            <button
              id="m4l-teaching-notes-tab" tabindex="-1"
              type="button"
              class="m4l-teaching-tab"
              role="tab"
              aria-selected="false"
              aria-controls="m4l-teaching-notes-view"
              data-m4l-teaching-tab="notes"
            >Notes</button>
          </div>

          <section
            id="m4l-teaching-drawing-view"
            class="m4l-teaching-view is-active"
            role="tabpanel"
            aria-labelledby="m4l-teaching-drawing-tab"
          >
            <div class="m4l-teaching-tools" aria-label="Drawing tools">
              <button type="button" class="m4l-teaching-tool is-active" data-m4l-draw-tool="pen">Pen</button>
              <button type="button" class="m4l-teaching-tool" data-m4l-draw-tool="eraser">Eraser</button>
              <label class="m4l-teaching-colour-label">
                <span>Colour</span>
                <input id="m4l-teaching-colour" type="color" value="#234569" aria-label="Drawing colour" />
              </label>
              <label class="m4l-teaching-width-label">
                <span>Size</span>
                <input id="m4l-teaching-width" type="number" min="1" max="18" step="1" value="4" aria-label="Line size" inputmode="numeric" />
              </label>
            </div>

            <div class="m4l-teaching-canvas-wrap">
              <canvas id="m4l-teaching-canvas" aria-label="Whiteboard drawing canvas"></canvas>
            </div>

            <div class="m4l-teaching-history-actions">
              <button type="button" data-m4l-whiteboard-action="undo">Undo</button>
              <button type="button" data-m4l-whiteboard-action="redo">Redo</button>
              <button type="button" data-m4l-whiteboard-action="saveDrawing">Save image</button>
              <button type="button" data-m4l-whiteboard-action="shareDrawing">Share</button>
            </div>
          </section>

          <section
            id="m4l-teaching-notes-view"
            class="m4l-teaching-view"
            role="tabpanel"
            aria-labelledby="m4l-teaching-notes-tab"
            hidden
          >
            <label class="m4l-teaching-notes-label" for="m4l-teaching-notes">Lesson notes</label>
            <textarea
              id="m4l-teaching-notes"
              class="m4l-teaching-notes"
              placeholder="Type lesson points, examples, reminders or homework..."
            ></textarea>
            <button type="button" data-m4l-whiteboard-action="saveNotes">Save notes</button>
          </section>
          <p id="m4l-whiteboard-status" class="m4l-whiteboard-status" role="status" aria-live="polite">Drawings and notes stay in this tab. Save a copy before leaving.</p>
        </aside></div><dialog id="pr-volume-dialog" aria-labelledby="pr-volume-title"><h2 id="pr-volume-title">Choose a volume</h2><p id="pr-volume-book"></p><div id="pr-volume-options"></div><button type="button" id="pr-volume-cancel">Cancel</button></dialog><script src="/js/m4l-config.js?v=107.2"></script><script src="/js/m4l-library-cache.js?v=107.12"></script><script type="module" src="/js/m4l-pdf-reader.mjs?v=107.15"></script><script src="/js/m4l-academy-navigation.js?v=107.19"></script><script src="/js/m4l-academy-mobile.js?v=107.3"></script><script src="/js/m4l-academy-page-actions.js?v=107.4"></script></body></html>
