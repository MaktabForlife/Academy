<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Open Library · Umm Abbad Academy</title>
  <link rel="stylesheet" href="/css/m4l-academy-library.css?v=106.49">
  <link rel="stylesheet" href="/css/m4l-open-library.css?v=106.49">
  <link rel="stylesheet" href="/css/m4l-academy-navigation.css?v=106.11">
<link rel="stylesheet" href="/css/m4l-academy-mobile.css?v=106.52">
<link rel="stylesheet" href="/css/m4l-academy-page-actions.css?v=106.52">
<link rel="stylesheet" href="/css/m4l-academy-shell.css?v=106.46">
</head>
<body>
  <header class="al-header"><a href="/academy/#overview">← Academy</a><strong>Open Library</strong><span></span></header>
  <main class="al-main">
    <div class="al-intro">

      <div class="library-title-row"><h1>Library</h1><button type="button" id="ol-refresh" class="library-refresh" aria-label="Refresh Library" title="Refresh Library" data-page-content-refresh>↻</button></div>
    </div>
    <nav class="al-tabs" aria-label="Library view"><a id="library-for-you" href="/academy/library/" hidden>For you</a><a href="/academy/open-library/" aria-current="page">Browse</a><a href="/academy/pdf-reader/?bookmarks=1">My bookmarks</a></nav>
    <div class="ol-search"><label for="ol-search">Search resources</label><input id="ol-search" type="search" placeholder="Title, subject or source"></div>
    <div id="ol-categories" class="library-category-pills" role="group" aria-label="Filter by category"><button type="button" data-category="ALL" aria-pressed="true">All</button><button type="button" data-category="PDF" aria-pressed="false">PDF</button><button type="button" data-category="AUDIOVISUAL" aria-pressed="false">AudioVisual</button><button type="button" data-category="OTHER" aria-pressed="false">Other</button></div>
    <p id="ol-status" class="ol-status" role="status" aria-live="polite"></p>
    <div id="ol-results"></div>
    <p id="ol-empty" class="al-empty" hidden>No resources match your search.</p>
  </main>
  <dialog id="ol-preview" aria-labelledby="ol-title">
    <div class="al-preview-head"><div><small id="ol-source"></small><h2 id="ol-title"></h2></div><button id="ol-close" type="button" aria-label="Close resource">✕</button></div>
    <p id="ol-details"></p>
    <div id="ol-volume-wrap" class="ol-volume" hidden><label id="ol-volume-label" for="ol-volume">Volume</label><select id="ol-volume"></select></div>
    <a id="ol-original" target="_blank" rel="noopener noreferrer">Open original PDF at source ↗</a>
    <iframe id="ol-viewer" title="Book preview"></iframe>
    <div id="ol-media"></div>
    <p class="ol-viewer-note">If the preview is unavailable, use the source link above.</p>
  </dialog>
  <script src="/js/m4l-config.js?v=106.67"></script>
  <script src="/js/m4l-library-cache.js?v=106.11"></script>
  <script src="/js/m4l-open-library.js?v=106.67" defer></script>
  <script src="/js/m4l-academy-navigation.js?v=106.67"></script>
<script src="/js/m4l-academy-mobile.js?v=106.51"></script>
<script src="/js/m4l-academy-page-actions.js?v=106.58"></script>
</body>
</html>
