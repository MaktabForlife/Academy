<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF icon samples</title><style>*{box-sizing:border-box}body{margin:0;background:#f4edf6;color:#302738;font:15px/1.5 Arial,sans-serif}main{max-width:900px;padding:32px 24px;margin:0 auto}h1{font:32px Georgia,serif;margin:0 0 8px}p{color:#6b5c70;margin:0 0 26px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:22px}section{background:#fff;border:1px solid #dfd3e4;border-radius:14px;text-align:center;padding:22px}h2{font-size:18px;margin:0 0 15px}.large{display:grid;place-items:center;height:155px}.large svg{width:115px;height:115px;color:#70477c}svg{display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.examples{display:flex;justify-content:center;gap:30px;padding-top:22px;border-top:1px solid #eee5f1;margin-top:12px}.examples>div{display:flex;align-items:center;flex-direction:column;gap:9px}.examples span{font-size:12px;color:#6b5c70}button{width:38px;height:38px;padding:7px;border:1px solid #dfd3e4;border-radius:7px;background:#fff;color:#70477c}button svg{width:22px;height:22px}.selected{background:#70477c;color:white;border-color:#70477c}.note{margin-top:20px;font-size:12px}a{color:#70477c}@media(max-width:520px){.cards{gap:12px}main{padding:20px 12px}section{padding:16px 8px}.examples{gap:16px}.large svg{width:90px;height:90px}.large{height:120px}}</style></head><body><main><h1>PDF toolbar icon samples</h1><p>Based on your two references.</p><div class="cards"><section><h2>Split PDF</h2><div class="large"><svg viewBox="0 0 32 28" aria-hidden="true"><rect x="2" y="4" width="28" height="20" rx="1.5"/><path d="M16 5v18" stroke-dasharray="3 3"/><path d="m7 11 3-2v10m11-8c0-4 6-4 6 0 0 3-6 4-6 8h6"/></svg></div><div class="examples"><div><span>Normal</span><button type="button" title="Split PDF" aria-label="Split PDF"><svg viewBox="0 0 32 28" aria-hidden="true"><rect x="2" y="4" width="28" height="20" rx="1.5"/><path d="M16 5v18" stroke-dasharray="3 3"/><path d="m7 11 3-2v10m11-8c0-4 6-4 6 0 0 3-6 4-6 8h6"/></svg></button></div><div><span>Selected</span><button type="button" class="selected" title="Split PDF" aria-label="Split PDF selected"><svg viewBox="0 0 32 28" aria-hidden="true"><rect x="2" y="4" width="28" height="20" rx="1.5"/><path d="M16 5v18" stroke-dasharray="3 3"/><path d="m7 11 3-2v10m11-8c0-4 6-4 6 0 0 3-6 4-6 8h6"/></svg></button></div></div></section><section><h2>Whiteboard</h2><div class="large"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="6" width="24" height="17" rx="2"/><path d="M14 6V3a2 2 0 0 1 4 0v3M16 23v7m-1-7-7 7m9-7 7 7"/></svg></div><div class="examples"><div><span>Normal</span><button type="button" title="Whiteboard" aria-label="Whiteboard"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="6" width="24" height="17" rx="2"/><path d="M14 6V3a2 2 0 0 1 4 0v3M16 23v7m-1-7-7 7m9-7 7 7"/></svg></button></div><div><span>Selected</span><button type="button" class="selected" title="Whiteboard" aria-label="Whiteboard selected"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="6" width="24" height="17" rx="2"/><path d="M14 6V3a2 2 0 0 1 4 0v3M16 23v7m-1-7-7 7m9-7 7 7"/></svg></button></div></div></section></div><p class="note">Large symbols above, actual toolbar buttons below. Available on tablets and desktop. Split PDF and Whiteboard stay hidden on phones.</p><a href="/academy/pdf-reader/">Open PDF reader →</a></main></body></html>
