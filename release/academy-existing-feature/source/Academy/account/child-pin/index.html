<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Academy PIN</title><link rel="stylesheet" href="/js/jwt-child-pin-form.css"><script src="/auth/v110/browser-config.js"></script><script src="/js/jwt-child-pin-form.js" defer></script></head>
<body><main><h1>Confirm your Academy PIN</h1><p id="pin-message" role="status">Checking the requested app.</p><form id="child-pin-form" autocomplete="off"><label for="child-pin">Four-digit PIN</label><input id="child-pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="off" required disabled><button id="child-pin-submit" type="submit" disabled>Continue</button></form><button id="child-pin-close" type="button">Close</button></main></body></html>
