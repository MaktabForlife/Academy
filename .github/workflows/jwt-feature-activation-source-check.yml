name: JWT Feature activation source proof
on:
  push:
    branches: [validation/jwt-feature-activation-20261107]
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: jwt-activation-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - run: npm ci --prefix backend --no-audit --no-fund
      - name: Only affected comparison latches and retained22/24 boundary traces
        run: |
          set -euo pipefail
          node --check backend/tools/jwt-feature-release-transport.mjs
          node --test --test-reporter=tap --test-name-pattern='actual new-baseline transport success|latest supported ordinary auth failure|valid foreign comparison latch' backend/tests/jwt-feature-activation-transport.test.mjs | tee activation-controls.tap
          git rev-parse HEAD > activation-source.txt
          git rev-parse HEAD^{tree} > activation-tree.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jwt-activation-source-${{ github.run_id }}
          path: |
            activation-controls.tap
            activation-source.txt
            activation-tree.txt
          retention-days: 30
