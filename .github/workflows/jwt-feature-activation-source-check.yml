name: JWT Feature activation source proof
on:
  push:
    branches: [validation/jwt-feature-activation-20261107]
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: jwt-activation-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - run: npm ci --prefix backend --no-audit --no-fund
      - name: Targeted truthful baseline/transport controls only
        run: |
          set -euo pipefail
          node --check backend/tools/jwt-feature-activation-baseline.mjs
          node --check backend/tools/jwt-feature-activation-build.mjs
          node --check backend/tools/jwt-feature-release-transport.mjs
          node --test --test-reporter=tap backend/tests/jwt-feature-activation-baseline.test.mjs backend/tests/jwt-feature-activation-transport.test.mjs | tee activation-controls.tap
          git rev-parse HEAD > activation-source.txt
          git rev-parse HEAD^{tree} > activation-tree.txt
      - name: Retrieve only the previously accepted PUBLIC byte evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/MaktabForlife/Academy/actions/artifacts/13576482979/zip > "$RUNNER_TEMP/accepted-public-evidence.zip"
      - name: Build affected ACTIVE/recovery inputs from unchanged accepted public bytes
        env:
          ACCEPTED_PUBLIC_ARCHIVE: ${{ runner.temp }}/accepted-public-evidence.zip
          ACTIVATION_OUTPUT: ${{ runner.temp }}/activation-build
        run: node backend/tools/jwt-feature-activation-build.mjs build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jwt-activation-source-${{ github.run_id }}
          path: |
            activation-controls.tap
            activation-source.txt
            activation-tree.txt
            ${{ runner.temp }}/activation-build/activation-inputs.json
          retention-days: 30
