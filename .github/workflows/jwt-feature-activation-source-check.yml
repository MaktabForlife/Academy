name: JWT Feature activation source proof
on:
  push:
    branches: [validation/jwt-feature-activation-20261107]
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: jwt-activation-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - run: npm ci --prefix backend --no-audit --no-fund
      - name: New authority quota caller and truthful publisher controls only
        run: |
          set -euo pipefail
          node --check backend/tools/jwt-feature-activation-approved.mjs
          node --check backend/tools/jwt-feature-activation-execute.mjs
          node --test --test-reporter=tap backend/tests/jwt-feature-activation-approved.test.mjs backend/tests/jwt-feature-activation-github.test.mjs backend/tests/jwt-feature-activation-execute.test.mjs | tee activation-controls.tap
          node --test --test-reporter=tap --test-name-pattern='expired prior window|full ACTIVE' backend/tests/jwt-feature-activation-baseline.test.mjs | tee activation-profiles.tap
          git rev-parse HEAD > activation-source.txt
          git rev-parse HEAD^{tree} > activation-tree.txt
      - name: Verify the new archive reader against only the already public accepted asset artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {activationGitHub} from './backend/tools/jwt-feature-activation-github.mjs';
          const c=activationGitHub({token:process.env.GITHUB_TOKEN,maximum:10});
          const r=await c.archive({id:13576482979,zipSHA256:'e1ecea65e3a3560b9b6b6f158f8137ba334b86894429d48f31319725a1c4a69a',maximumBytes:1048576});
          writeFileSync('activation-public-archive-reader.json',JSON.stringify({schema:1,artifact:13576482979,zipSHA256:createHash('sha256').update(r.bytes).digest('hex'),bytes:r.bytes.length,stats:c.stats,privateReceiptRead:false,cloudflareCalls:0},null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jwt-activation-source-${{ github.run_id }}
          path: |
            activation-controls.tap
            activation-profiles.tap
            activation-source.txt
            activation-tree.txt
            activation-request-traces.json
            activation-public-archive-reader.json
          retention-days: 30
