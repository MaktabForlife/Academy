name: V111 exact-source checks only
on:
  workflow_dispatch:
    inputs:
      academy_ref:
        description: Exact independently reviewed Academy commit SHA
        required: true
        type: string
      studio_ref:
        description: Exact independently reviewed AcademyStudio commit SHA
        required: true
        type: string
      hifz_ref:
        description: Exact independently reviewed Hifz commit SHA
        required: true
        type: string
      source_manifest_sha256:
        description: SHA256 of the reviewed Academy deployment/v111-source-manifest.json
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: v111-source-${{ inputs.academy_ref }}-${{ inputs.studio_ref }}-${{ inputs.hifz_ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: "false"
      GIT_OPTIONAL_LOCKS: "0"
      GIT_NO_LAZY_FETCH: "1"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Require explicit exact source triple and reviewed manifest digest
        env:
          ACADEMY_REF: ${{ inputs.academy_ref }}
          STUDIO_REF: ${{ inputs.studio_ref }}
          HIFZ_REF: ${{ inputs.hifz_ref }}
          MANIFEST_SHA256: ${{ inputs.source_manifest_sha256 }}
          CONTROL_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$ACADEMY_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$STUDIO_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HIFZ_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CONTROL_REF" == "studio_dev" || "$CONTROL_REF" == codex/v111-* ]]
      - name: Read the reviewed controller version
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: Controller
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Read exact Academy source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MaktabForlife/Academy
          ref: ${{ inputs.academy_ref }}
          path: Academy
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Read exact Studio source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MaktabForlife/AcademyStudio
          ref: ${{ inputs.studio_ref }}
          path: AcademyStudio
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Read exact Hifz source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MaktabForlife/Hifz
          ref: ${{ inputs.hifz_ref }}
          path: Hifz
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Use the verified Node line
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.22.1"
      - name: Install exact locked test and bundle dependencies without package scripts
        run: |
          set -euo pipefail
          npm ci --prefix Academy/backend --ignore-scripts --no-audit --no-fund
          npm ci --prefix AcademyStudio --ignore-scripts --no-audit --no-fund
      - name: Install the existing pinned credential scanner
        env:
          SCANNER_DIGEST: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v111-scanner"
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/v111-scanner/package.tgz"
          printf '%s  %s\n' "$SCANNER_DIGEST" "$RUNNER_TEMP/v111-scanner/package.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/v111-scanner/package.tgz" -C "$RUNNER_TEMP/v111-scanner" gitleaks
      - name: Validate exact source, new reachable history, native checks and five selected Worker entries
        env:
          ACADEMY_REF: ${{ inputs.academy_ref }}
          STUDIO_REF: ${{ inputs.studio_ref }}
          HIFZ_REF: ${{ inputs.hifz_ref }}
          MANIFEST_SHA256: ${{ inputs.source_manifest_sha256 }}
        run: |
          set -euo pipefail
          node Controller/tools/v111-source-ci.mjs \
            --workspace "$GITHUB_WORKSPACE" \
            --academy-ref "$ACADEMY_REF" \
            --studio-ref "$STUDIO_REF" \
            --hifz-ref "$HIFZ_REF" \
            --manifest-sha256 "$MANIFEST_SHA256" \
            --scanner "$RUNNER_TEMP/v111-scanner/gitleaks" \
            --output "$RUNNER_TEMP/v111-source-only/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Retain bounded source-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v111-source-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v111-source-only/
          if-no-files-found: warn
          retention-days: 30
# No push/PR/schedule/workflow_run triggers, provider environment, credential import,
# approval/status writer, legacy Feature/release workflow or deployment command.
