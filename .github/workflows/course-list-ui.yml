name: Course list UI regression
on:
  push:
    branches: [feature/course-list-20261106]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  local-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - run: npm ci --prefix backend --no-audit --no-fund
      - name: Actual native draft/archive and owning-policy UI checks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/course-list-evidence"
          node --check js/m4l-academy-course-management.js
          node --check js/m4l-studio-access.js
          node --test --test-reporter=tap backend/tests/academy-course-management-ui.test.mjs backend/tests/academy-d1-course-management.test.mjs backend/tests/academy-studio-access-ui.test.mjs 2>&1 | tee "$RUNNER_TEMP/course-list-evidence/tests.log"
      - run: node backend/tools/academy-pages-build.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: course-list-native-${{ github.run_id }}
          path: ${{ runner.temp }}/course-list-evidence/
          if-no-files-found: error
          retention-days: 14
