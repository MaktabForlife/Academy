name: Course list UI regression
on:
  push:
    branches: [feature/course-list-20261106c]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  local-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - run: npm ci --prefix backend --no-audit --no-fund
      - name: Actual native draft/archive and owning-policy UI checks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/course-list-evidence"
          node --check js/m4l-academy-course-management.js
          node --check js/m4l-studio-access.js
          node --test --test-reporter=tap backend/tests/academy-course-management-ui.test.mjs backend/tests/academy-d1-course-management.test.mjs backend/tests/academy-studio-access-ui.test.mjs 2>&1 | tee "$RUNNER_TEMP/course-list-evidence/tests.log"
      - run: node backend/tools/academy-pages-build.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: course-list-native-${{ github.run_id }}
          path: ${{ runner.temp }}/course-list-evidence/
          if-no-files-found: error
          retention-days: 14
  browser:
    needs: [local-native, studio-policy]
    name: Course page (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-24.04
    # Official matching browser+OS image; avoids repeated slow apt mirror setup.
    # https://playwright.dev/docs/docker
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --init --ipc=host
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MaktabForlife/Academy
          ref: bbf9b109fd703b801bbb6ab19e6f3e0bbd355ced
          path: fixture-source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MaktabForlife/Academy
          ref: 50c32f6f550b52512453461074ad6e12af384fe3
          path: baseline-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - run: npm ci --prefix backend --no-audit --no-fund
      - run: npm ci --prefix fixture-source/backend --no-audit --no-fund
      - name: Build the exact checked source inside the browser container
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          node backend/tools/academy-pages-build.mjs
      - name: Install isolated browser
        env:
          REVIEW_BROWSER_MODULES: ${{ runner.temp }}/course-list-browser
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: |
          set -euo pipefail
          npm install --prefix "$REVIEW_BROWSER_MODULES" --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          node "$REVIEW_BROWSER_MODULES/node_modules/playwright/cli.js" install ${{ matrix.browser }}
      - name: Exercise packaged Course list and native settings
        env:
          REVIEW_BROWSER_MODULES: ${{ runner.temp }}/course-list-browser
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
          HOME_LOGIN_FIXTURE_ROOT: ${{ github.workspace }}/fixture-source
          HOME_LOGIN_BROWSER: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          node tools/course-list-ui-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: course-list-${{ matrix.browser }}-${{ github.run_id }}
          path: ${{ runner.temp }}/course-list-evidence/
          if-no-files-found: error
          retention-days: 14
  studio-policy:
    name: Pinned Studio native policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
      ACADEMY_SOURCE: ${{ github.workspace }}/Academy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MaktabForlife/AcademyStudio
          ref: 1fd6d1af577fd2adf81a054d67860c3fa4d66f21
          path: studio-source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MaktabForlife/Academy
          ref: 38e66a57f0e094089718dd9dce6ff632f6247d68
          path: Academy
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - run: npm ci --prefix studio-source --no-audit --no-fund
      - run: npm ci --prefix Academy/backend --no-audit --no-fund
      - name: Actual current owning policy and retained rights
        working-directory: studio-source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/course-list-policy-evidence"
          node --test --test-reporter=tap tests/course-policy.test.mjs 2>&1 | tee "$RUNNER_TEMP/course-list-policy-evidence/studio-policy.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: course-list-studio-policy-${{ github.run_id }}
          path: ${{ runner.temp }}/course-list-policy-evidence/
          if-no-files-found: error
          retention-days: 14
