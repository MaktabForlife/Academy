name: JWT Feature private setup primitive
on:
  create:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  setup-source:
    if: github.ref == 'refs/heads/validation/jwt-feature-private-setup-20261106'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - run: npm ci --prefix backend --no-audit --no-fund
      - run: npm install --prefix "$RUNNER_TEMP/jwt-setup-runtime" --no-audit --no-fund --save-exact miniflare@5.20261103.0-beta
      - name: Auth isolation and actual workerd durable setup claims
        env:
          FEATURE_MF_ROOT: ${{ runner.temp }}/jwt-setup-runtime
        run: |
          mkdir -p "$RUNNER_TEMP/jwt-private-setup-evidence"
          node --test --test-reporter=tap backend/tests/jwt-feature-setup-auth.test.mjs backend/tests/jwt-feature-setup-workerd.test.mjs 2>&1 | tee "$RUNNER_TEMP/jwt-private-setup-evidence/setup.log"
      - name: Syntax and untouched native config
        run: |
          node --check backend/src/academy/jwt-feature-setup.mjs
          node backend/tools/feature-target-guard.mjs .
          git diff --check
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jwt-private-setup-${{ github.run_id }}
          path: ${{ runner.temp }}/jwt-private-setup-evidence/
          if-no-files-found: error
          retention-days: 30
