name: JWT Feature first replacement source controls
on:
  push:
    branches: [validation/jwt-feature-first-replacement-20261107]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: jwt-first-replacement-source-${{ github.ref }}
  cancel-in-progress: false
env:
  FIRST_REPLACEMENT_PLAN_SHA256: c37bdb5d0570a03e68d23f933f82fe07913d44a9b91fc80b56c5e6c7eaa2b9e5
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - run: npm ci --prefix backend --no-audit --no-fund
      - name: Save exact checked-out source and tree on the disposable runner
        run: |
          git rev-parse HEAD > first-replacement-checked-source.txt
          git rev-parse HEAD^{tree} > first-replacement-checked-tree.txt
      - name: Affected gates/private-wrapper mocks only; reuse exact accepted asset/app/ACK archives
        run: |
          set -euo pipefail
          node --check backend/tools/jwt-feature-first-replacement-approved.mjs
          node --check backend/tools/jwt-feature-first-replacement-execute.mjs
          node --test --test-reporter=tap backend/tests/jwt-feature-first-replacement-approved.test.mjs backend/tests/jwt-feature-first-replacement-execute.test.mjs | tee first-replacement-control.tap
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jwt-feature-first-replacement-control-${{ github.run_id }}
          path: |
            first-replacement-control.tap
            first-replacement-checked-source.txt
            first-replacement-checked-tree.txt
          retention-days: 30
