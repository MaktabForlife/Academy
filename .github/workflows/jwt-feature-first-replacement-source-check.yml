name: JWT Feature first replacement source preparation
on:
  push:
    branches: [validation/jwt-feature-first-replacement-20261107]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: jwt-first-replacement-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - run: npm ci --prefix backend
      - name: Full offline config/artifact preparation only; no credentials or hosted calls
        env:
          FIRST_REPLACEMENT_OUTPUT: ${{ runner.temp }}/first-replacement-public
        run: |
          set -euo pipefail
          node --check backend/tools/jwt-feature-first-replacement-inputs.mjs
          node --check backend/tools/jwt-feature-first-replacement-build.mjs
          node --test --test-reporter=tap backend/tests/jwt-feature-first-replacement-inputs.test.mjs | tee first-replacement-inputs.tap
          node backend/tools/jwt-feature-first-replacement-build.mjs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c660e3813908127561ad454ab503f9f66fa6d700
          path: .original-public-source
          persist-credentials: false
      - name: Reproduce only the pinned historical public builder for byte comparison
        env:
          FIRST_REPLACEMENT_OUTPUT: ${{ runner.temp }}/first-replacement-public
          ORIGINAL_PUBLIC_EVIDENCE: ${{ runner.temp }}/original-public-evidence
        run: |
          set -euo pipefail
          test "$(git -C .original-public-source rev-parse HEAD)" = c660e3813908127561ad454ab503f9f66fa6d700
          mkdir "$ORIGINAL_PUBLIC_EVIDENCE"
          GITHUB_SHA=c660e3813908127561ad454ab503f9f66fa6d700 JWT_V110_EVIDENCE="$ORIGINAL_PUBLIC_EVIDENCE" node .original-public-source/backend/tools/jwt-v110-feature-public-build.mjs
          node backend/tools/jwt-feature-first-replacement-assets.mjs compare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jwt-feature-first-replacement-source-${{ github.run_id }}
          path: |
            first-replacement-inputs.tap
            ${{ runner.temp }}/first-replacement-public/
          retention-days: 30
