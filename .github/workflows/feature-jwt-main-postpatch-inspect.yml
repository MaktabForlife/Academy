name: Protected MAIN post-PATCH read-only inspection
on:
  push:
    branches: [studio_dev]
  pull_request:
    branches: [studio_dev]
  workflow_dispatch:
    inputs:
      approval_pr:
        type: string
        required: true
      approval_merge_sha:
        type: string
        required: true
permissions:
  contents: read
  actions: read
  statuses: read
  pull-requests: read
defaults:
  run:
    shell: bash
concurrency:
  group: feature-isolation-${{ github.ref }}
  cancel-in-progress: false
# Canonical is a PUBLIC loader only. The unchanged selected Feature workflow owns private execution.
jobs:
  check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: canonical
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - id: selection
        name: Verify the explicit component plan without changing canonical settings
        working-directory: canonical
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,appendFileSync} from 'node:fs';
          import {validatePlan} from './tools/approved-deployment.mjs';
          const p=JSON.parse(readFileSync('deployment/release-plan.json','utf8'));
          const selected=p.request==='jwt-feature-main-postpatch-inspection-20261107a';
          if(selected){
           validatePlan(p,'MaktabForlife/Academy',['deployment/release-plan.json']);
           assert.equal(p.kind,'component');assert.equal(p.target,'feature');assert.equal(p.contains_jwt,true);assert.equal(p.database_changes,false);assert.equal(p.version,'110.36');
           assert.equal(p.feature_sha,'e682301619ec20d65f5530948bb664529c1440dc');assert.equal(p.feature_base_sha,'6b21ad29a7818be0846d2cd5d404350925e361f1');
          }
          appendFileSync(process.env.GITHUB_OUTPUT,'selected='+selected+'\n');
          console.log(JSON.stringify({selected,cloudflareCalls:0,hostedDatabaseCalls:0}));
          NODE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.selection.outputs.selected == 'true'
        with:
          ref: e682301619ec20d65f5530948bb664529c1440dc
          path: prepared
          persist-credentials: false
      - name: Check the immutable Feature wrapper in its own reviewed dependency tree
        if: steps.selection.outputs.selected == 'true'
        working-directory: prepared
        run: |
          set -euo pipefail
          node --check backend/tools/jwt-feature-main-postpatch-inspect.mjs
          node --check backend/tools/jwt-feature-main-postpatch-approved.mjs
          node --test --test-reporter=tap backend/tests/jwt-feature-main-postpatch-inspect.test.mjs | tee "$RUNNER_TEMP/wrapper-tests.tap"
      - name: Bind packaging to the exact reviewed source/effects and public loader
        if: steps.selection.outputs.selected == 'true'
        working-directory: canonical
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {resolve} from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {executionEffectsHash,scopeLines} from '../prepared/backend/tools/jwt-feature-main-postpatch-approved.mjs';
          const actual=execFileSync('git',['rev-parse','HEAD'],{cwd:'../prepared',encoding:'utf8'}).trim();
          assert.equal(actual,'e682301619ec20d65f5530948bb664529c1440dc');
          assert.equal(executionEffectsHash,'6b96a689281d6115301e435674fc5d1f2847068917a887ba8017558d70e74650');
          const wf=readFileSync('.github/workflows/feature-jwt-main-postpatch-inspect.yml','utf8');
          assert(!/^\s+environment\s*:/m.test(wf)&&!wf.includes('secrets.'+'CF_FEATURE_DEPLOY_TOKEN'));
          writeFileSync(resolve(process.env.RUNNER_TEMP,'selected-source.json'),JSON.stringify({selectedFeatureSource:actual,effectsSHA256:executionEffectsHash,scopeLines:scopeLines(actual),canonicalLoaderOnly:true,cloudflareCalls:0,hostedDatabaseCalls:0},null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.selection.outputs.selected == 'true'
        with:
          name: jwt-main-postpatch-component-package-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/wrapper-tests.tap
            ${{ runner.temp }}/selected-source.json
          if-no-files-found: warn
          retention-days: 30
  prepare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/studio_dev'
    permissions:
      contents: write
      actions: read
      statuses: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: canonical
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e682301619ec20d65f5530948bb664529c1440dc
          path: prepared
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Exact protected source fast-forward only, never dispatch or hosted inspection
        working-directory: canonical
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ../prepared/backend/tools/jwt-feature-main-postpatch-approved.mjs promote
