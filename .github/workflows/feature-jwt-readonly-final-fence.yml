name: Protected read-only JWT Feature final fences
on:
  push:
    branches: [studio_dev, validation/jwt-feature-readonly-final-fence-wiring-20261107]
  pull_request:
    branches: [studio_dev]
  workflow_dispatch:
    inputs:
      approval_pr:
        type: string
        required: true
      approval_merge_sha:
        type: string
        required: true
permissions:
  contents: read
  actions: read
  statuses: read
  pull-requests: read
defaults:
  run:
    shell: bash
concurrency:
  group: feature-isolation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Focused protected wiring and artifact proof only
        run: |
          set -euo pipefail
          node --check backend/tools/jwt-feature-readonly-final-fence-approved.mjs
          node --test --test-reporter=tap backend/tests/jwt-feature-readonly-final-fence-approved.test.mjs | tee final-fence-wiring.tap
          node --input-type=module -e "import {executionPlanSHA256,executionPlan} from './backend/tools/jwt-feature-readonly-final-fence-approved.mjs'; console.log(JSON.stringify({executionPlanSHA256,frozenController:executionPlan.frozenControllerSource,effectsSHA256:executionPlan.effectsSHA256,hostedCalls:0}));" > final-fence-wiring-source.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jwt-final-fence-wiring-source-${{ github.run_id }}
          path: |
            final-fence-wiring.tap
            final-fence-wiring-source.json
          retention-days: 30
  prepare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/studio_dev'
    permissions:
      contents: write
      actions: read
      statuses: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Exact approved public source fast-forward only; never dispatch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node backend/tools/jwt-feature-readonly-final-fence-approved.mjs promote
  validate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature-preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Public exact approval/source/all-head attempt/lease gate before private environment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPROVAL_PR: ${{ inputs.approval_pr }}
          APPROVAL_MERGE_SHA: ${{ inputs.approval_merge_sha }}
        run: node backend/tools/jwt-feature-readonly-final-fence-approved.mjs validate
  inspect:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature-preview'
    environment: feature
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Recheck protected gate before credential
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPROVAL_PR: ${{ inputs.approval_pr }}
          APPROVAL_MERGE_SHA: ${{ inputs.approval_merge_sha }}
        run: node backend/tools/jwt-feature-readonly-final-fence-approved.mjs validate
      - name: At most four fixed metadata reads and three credential-free paused reads; no retry
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPROVAL_PR: ${{ inputs.approval_pr }}
          APPROVAL_MERGE_SHA: ${{ inputs.approval_merge_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_FEATURE_DEPLOY_TOKEN }}
        run: node backend/tools/jwt-feature-readonly-final-fence-approved.mjs execute
      - name: Validate and publish only a bounded redacted receipt; unknown remains unknown
        if: always()
        run: node backend/tools/jwt-feature-readonly-final-fence-approved.mjs publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jwt-final-fence-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/jwt-final-fence-artifact-${{ github.run_id }}-1/final-fence-verification.json
          if-no-files-found: warn
          retention-days: 30
