name: JWT actual release caller metadata regression
on:
  push:
    branches: [validation/jwt-feature-release-readback-20261107]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  local-shape:
    if: github.ref == 'refs/heads/validation/jwt-feature-release-readback-20261107'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Actual transport caller with injected HTTP only; no credentials or hosted calls
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jwt-release-readback-proof"
          node --check backend/tests/jwt-feature-release.test.mjs
          node --test --test-reporter=tap backend/tests/jwt-feature-release.test.mjs | tee "$RUNNER_TEMP/jwt-release-readback-proof/tests.tap"
          git diff --check
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jwt-release-readback-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/jwt-release-readback-proof/
          retention-days: 30
          if-no-files-found: error
