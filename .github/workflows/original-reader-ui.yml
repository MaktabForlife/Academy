name: Original website native entry
on:
  push:
    branches: [feature/original-reader-entry-20261106]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      WRANGLER_SEND_METRICS: 'false'
      ACADEMY_SOURCE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: Academy
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MaktabForlife/AcademyStudio
          ref: 3c420f35c30297cfcc41cfab24f030e51bb7831e
          path: studio-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - run: npm ci --prefix backend --no-audit --no-fund
      - run: npm ci --prefix Academy/backend --no-audit --no-fund
      - run: npm ci --prefix studio-source --no-audit --no-fund
      - name: Exact link transport and existing native issuer/exchange guards
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original-reader-evidence"
          node --check js/m4l-course-media.js
          node --test --test-reporter=tap backend/tests/course-reader-entry.test.mjs 2>&1 | tee "$RUNNER_TEMP/original-reader-evidence/links.log"
          cd studio-source
          node --test --test-reporter=tap tests/academy-connect.test.mjs tests/native-portal-paired.test.mjs 2>&1 | tee "$RUNNER_TEMP/original-reader-evidence/paired.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-reader-native-${{ github.run_id }}
          path: ${{ runner.temp }}/original-reader-evidence/
          if-no-files-found: error
          retention-days: 14
  browser:
    needs: native
    name: Original reader (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
      ACADEMY_SOURCE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: Academy
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MaktabForlife/Academy
          ref: 50c32f6f550b52512453461074ad6e12af384fe3
          path: baseline-source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MaktabForlife/AcademyStudio
          ref: 3c420f35c30297cfcc41cfab24f030e51bb7831e
          path: studio-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - run: npm ci --prefix backend --no-audit --no-fund
      - run: npm ci --prefix Academy/backend --no-audit --no-fund
      - run: npm ci --prefix studio-source --no-audit --no-fund
      - run: node backend/tools/academy-pages-build.mjs
      - name: Install isolated browser
        env:
          REVIEW_BROWSER_MODULES: ${{ runner.temp }}/original-reader-browser
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/original-reader-browsers
        run: |
          set -euo pipefail
          npm install --prefix "$REVIEW_BROWSER_MODULES" --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          node "$REVIEW_BROWSER_MODULES/node_modules/playwright/cli.js" install --with-deps ${{ matrix.browser }}
      - name: Frozen direct link versus current native entry
        env:
          REVIEW_BROWSER_MODULES: ${{ runner.temp }}/original-reader-browser
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/original-reader-browsers
          REVIEW_BROWSER: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          node tools/original-reader-ui-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-reader-${{ matrix.browser }}-${{ github.run_id }}
          path: ${{ runner.temp }}/original-reader-evidence/
          if-no-files-found: error
          retention-days: 14
