name: Feature local smoke usage budget
on:
  create:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  local-budget:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/validation/feature-budget-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
      FEATURE_BUDGET_EVIDENCE: ${{ runner.temp }}/feature-local-budget
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - run: npm ci --prefix backend --no-audit --no-fund
      - run: node backend/tools/feature-hosting-overlay.mjs
      - name: Measure only disposable native runtime
        run: |
          set -o pipefail
          mkdir -p "$FEATURE_BUDGET_EVIDENCE"
          node --test --test-reporter=tap backend/tests/feature-local-budget.test.mjs 2>&1 | tee "$FEATURE_BUDGET_EVIDENCE/local-budget.log"
          test "$(git diff --name-only)" = "config/hosting.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: feature-local-budget-${{ github.run_id }}
          path: ${{ runner.temp }}/feature-local-budget/
          retention-days: 30
