name: Default-off private video transport
on:
  push:
    branches: [feature/video-processing-transport-20261106, feature/ui003-processing-development-20261106]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - run: npm ci --ignore-scripts
        working-directory: backend
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MaktabForlife/AcademyStudio
          ref: df0ce57d85daaf7af93de906d409d3a60284655f
          path: .test-video-studio
          persist-credentials: false
      - name: Native Academy authentication and bounded signed transport; no hosted calls
        working-directory: backend
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/video-academy-transport"
          node --check src/academy/d1/web-platform/video-processing.mjs
          node --check src/academy/d1/web-platform/studio-admin.mjs
          node --check src/academy/d1/worker.js
          node --check ../js/m4l-course-media.js
          node --check ../js/m4l-course-media-view.mjs
          node --check ../js/m4l-video-processing.mjs
          node --check ../js/m4l-media-admin-panel.mjs
          node --check ../js/m4l-media-workflow.mjs
          export VIDEO_STUDIO_SOURCE="$GITHUB_WORKSPACE/.test-video-studio"
          node --test --test-reporter=tap tests/academy-video-processing-transport.test.mjs tests/academy-video-processing-package.test.mjs 2>&1 | tee "$RUNNER_TEMP/video-academy-transport/tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: academy-video-transport-${{ github.run_id }}
          path: ${{ runner.temp }}/video-academy-transport/
          if-no-files-found: error
          retention-days: 14
