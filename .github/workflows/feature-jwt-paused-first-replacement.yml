name: Protected PAUSED JWT Feature first replacement
on:
  push:
    branches: [studio_dev]
  pull_request:
    branches: [studio_dev]
  workflow_dispatch:
    inputs:
      approval_pr:
        type: string
        required: true
      approval_merge_sha:
        type: string
        required: true
      source_preparation_run_id:
        type: string
        required: true
      window_comment_id:
        type: string
        required: true
      window_status_id:
        type: string
        required: true
permissions:
  contents: read
  actions: read
  statuses: read
  pull-requests: read
defaults:
  run:
    shell: bash
env:
  FIRST_REPLACEMENT_PLAN_SHA256: c37bdb5d0570a03e68d23f933f82fe07913d44a9b91fc80b56c5e6c7eaa2b9e5
concurrency:
  group: feature-isolation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      selected: ${{ steps.select.outputs.selected }}
      feature_source: ${{ steps.select.outputs.feature_source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: select
        name: Read the public component selector; no promotion or credential
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';import assert from 'node:assert/strict';
          const p=JSON.parse(readFileSync('deployment/release-plan.json','utf8'));
          const selected=p.request==='jwt-feature-paused-first-replacement-20261107a';
          if(selected){assert.equal(p.kind,'component');assert.equal(p.target,'feature');assert.equal(p.contains_jwt,true);assert.equal(p.database_changes,false);assert(/^[a-f0-9]{40}$/.test(p.feature_sha));}
          appendFileSync(process.env.GITHUB_OUTPUT,'selected='+selected+'\n'+(selected?'feature_source='+p.feature_sha+'\n':''));
          NODE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.select.outputs.selected == 'true'
        with:
          ref: ${{ steps.select.outputs.feature_source }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.select.outputs.selected == 'true'
        with:
          node-version: "24.18.0"
      - if: steps.select.outputs.selected == 'true'
        run: npm ci --prefix backend --no-audit --no-fund
      - if: steps.select.outputs.selected == 'true'
        name: Focused controls only; accepted asset/app/parser evidence is reused
        run: |
          set -euo pipefail
          node --check backend/tools/jwt-feature-first-replacement-approved.mjs
          node --check backend/tools/jwt-feature-first-replacement-execute.mjs
          node --test --test-reporter=tap backend/tests/jwt-feature-first-replacement-approved.test.mjs backend/tests/jwt-feature-first-replacement-execute.test.mjs | tee first-replacement-control.tap
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.select.outputs.selected == 'true'
        with:
          name: jwt-first-replacement-control-${{ github.run_id }}
          path: first-replacement-control.tap
          retention-days: 30
  prepare:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/studio_dev' && needs.check.outputs.selected == 'true'
    permissions:
      contents: write
      actions: read
      statuses: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.check.outputs.feature_source }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Exact protected public source preparation only; never dispatch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPROVAL_MERGE_SHA: ${{ github.sha }}
          SOURCE_CANDIDATE: ${{ needs.check.outputs.feature_source }}
          SOURCE_PREPARATION_OUTPUT: ${{ runner.temp }}/source-prepared.json
        run: node backend/tools/jwt-feature-first-replacement-approved.mjs promote
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jwt-first-replacement-public-${{ github.run_id }}
          path: ${{ runner.temp }}/source-prepared.json
          if-no-files-found: error
          retention-days: 30
  validate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature-preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Exact source/approval/preparation/new-window/all-head attempt gate before private environment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPROVAL_PR: ${{ inputs.approval_pr }}
          APPROVAL_MERGE_SHA: ${{ inputs.approval_merge_sha }}
          SOURCE_PREPARATION_RUN_ID: ${{ inputs.source_preparation_run_id }}
          WINDOW_COMMENT_ID: ${{ inputs.window_comment_id }}
          WINDOW_STATUS_ID: ${{ inputs.window_status_id }}
        run: node backend/tools/jwt-feature-first-replacement-approved.mjs validate
  execute:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature-preview'
    environment: feature
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
      APPROVAL_PR: ${{ inputs.approval_pr }}
      APPROVAL_MERGE_SHA: ${{ inputs.approval_merge_sha }}
      SOURCE_PREPARATION_RUN_ID: ${{ inputs.source_preparation_run_id }}
      WINDOW_COMMENT_ID: ${{ inputs.window_comment_id }}
      WINDOW_STATUS_ID: ${{ inputs.window_status_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Recheck current protected registration before credential attachment
        run: node backend/tools/jwt-feature-first-replacement-approved.mjs validate
      - run: npm ci --prefix backend --no-audit --no-fund
      - id: operation
        name: Sole Deployment PAUSED first replacement; no retry/auth/SQL/secret operation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_FEATURE_DEPLOY_TOKEN }}
        run: node backend/tools/jwt-feature-first-replacement-execute.mjs execute
      - name: Publish only a run-bound redacted receipt; failed/partial remains UNKNOWN
        if: always()
        env:
          EXECUTOR_OUTCOME: ${{ steps.operation.outcome }}
        run: node backend/tools/jwt-feature-first-replacement-execute.mjs publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jwt-first-replacement-private-${{ github.run_id }}
          path: ${{ runner.temp }}/jwt-first-replacement-artifact-${{ github.run_id }}-1/paused-first-replacement.json
          if-no-files-found: warn
          retention-days: 30
