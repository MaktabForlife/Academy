name: Deleted homepage card regression
on:
  push:
    branches: [feature/home-promotional-card-20261106]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  browser:
    name: Public content (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MaktabForlife/Academy
          ref: bbf9b109fd703b801bbb6ab19e6f3e0bbd355ced
          path: fixture-source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MaktabForlife/Academy
          ref: fb739eed1cf5b4f2b2490088b5802ddfd1d5d710
          path: ui-baseline
          persist-credentials: false
          sparse-checkout: portal/circles/app.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - run: npm ci --prefix backend --no-audit --no-fund
      - run: npm ci --prefix fixture-source/backend --no-audit --no-fund
      - run: node backend/tools/academy-pages-build.mjs
      - name: Install isolated browser
        env:
          REVIEW_BROWSER_MODULES: ${{ runner.temp }}/home-login-browser
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/home-login-browsers
        run: |
          set -euo pipefail
          npm install --prefix "$REVIEW_BROWSER_MODULES" --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          node "$REVIEW_BROWSER_MODULES/node_modules/playwright/cli.js" install --with-deps ${{ matrix.browser }}
      - name: Verify deleted content through native login and Admin transition
        env:
          REVIEW_BROWSER_MODULES: ${{ runner.temp }}/home-login-browser
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/home-login-browsers
          HOME_LOGIN_FIXTURE_ROOT: ${{ github.workspace }}/fixture-source
          HOME_LOGIN_BASELINE_ROOT: ${{ github.workspace }}/ui-baseline
          HOME_LOGIN_BROWSER: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          node tools/home-promotional-card-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: home-login-layout-${{ matrix.browser }}-${{ github.run_id }}
          path: ${{ runner.temp }}/home-login-evidence/
          if-no-files-found: error
          retention-days: 14
