name: JWT upload ACK primitive source tests only
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  check:
    if: github.ref == 'refs/heads/validation/jwt-upload-ack-primitive-20261107'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Standalone parser and exclusive runner-file checks; no Wrangler install or execution
        run: |
          set -euo pipefail
          node --check backend/tools/jwt-feature-upload-ack.mjs
          node --test --test-reporter=tap backend/tests/jwt-feature-upload-ack.test.mjs | tee "$RUNNER_TEMP/ack-tests.tap"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jwt-upload-ack-source-${{ github.run_id }}
          path: ${{ runner.temp }}/ack-tests.tap
          if-no-files-found: warn
          retention-days: 30
