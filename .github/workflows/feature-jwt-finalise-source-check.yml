name: JWT Feature finalisation source-only checks
on:
  push:
    branches: [validation/jwt-feature-finalisation-20261107]
  pull_request:
    branches: [studio_dev]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: jwt-finalisation-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Local Node mocks/schema fixtures only; no credentials or hosted requests
        run: |
          set -euo pipefail
          node --check backend/tools/jwt-feature-install-metadata.mjs
          node --check backend/tools/jwt-feature-finalise.mjs
          node --test --test-reporter=tap backend/tests/jwt-feature-finalise.test.mjs backend/tests/jwt-feature-install-package.test.mjs | tee finalisation-tests.tap
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jwt-finalisation-source-check-${{ github.run_id }}
          path: finalisation-tests.tap
          retention-days: 30
