name: JWT new-only DDL budget
on:
  create:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  ddl-local:
    if: github.ref == 'refs/heads/validation/jwt-feature-ddl-budget-20261106'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - run: npm ci --prefix backend --no-audit --no-fund
      - run: npm install --prefix "$RUNNER_TEMP/jwt-ddl-runtime" --no-audit --no-fund --save-exact miniflare@5.20261103.0-beta
      - name: Full empty schemas and exact finite validation only
        env:
          FEATURE_MF_ROOT: ${{ runner.temp }}/jwt-ddl-runtime
          WRANGLER_SEND_METRICS: "false"
        run: |
          mkdir -p "$RUNNER_TEMP/jwt-ddl-budget-evidence"
          node --test --test-reporter=tap backend/tests/jwt-feature-ddl-budget.test.mjs 2>&1 | tee "$RUNNER_TEMP/jwt-ddl-budget-evidence/ddl.log"
          git diff --check
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jwt-ddl-budget-${{ github.run_id }}
          path: ${{ runner.temp }}/jwt-ddl-budget-evidence/
          if-no-files-found: error
          retention-days: 30
