name: Approved JWT Feature release
run-name: Feature ${{ inputs.credential_preflight && 'credential preflight' || inputs.approval_merge_sha }}
on:
  workflow_dispatch:
    inputs:
      modern_stage:
        description: Explicit existing-Feature stage; none preserves legacy behavior
        type: choice
        default: none
        options: [none, upload, activate, diagnose]
      package_manifest_sha256:
        description: Exact reviewed immutable candidate manifest SHA256
        required: false
        type: string
      upload_run_id:
        description: Prior successful modern upload run; activate only
        required: false
        type: string
      upload_receipt_sha256:
        description: Exact staged.json SHA256; activate only
        required: false
        type: string
      journal_receipt_sha256:
        description: Exact Root actual-schema gate SHA256; activate only
        required: false
        type: string
      credential_preflight:
        description: GET-only check of existing Feature credentials and resources
        default: false
        type: boolean
      expected_sha:
        description: Exact selected preflight source commit
        required: false
        type: string
      expected_token_id:
        description: Reviewed token metadata identifier; never logged
        required: false
        type: string
      approval_pr:
        required: false
        type: string
      approval_merge_sha:
        required: false
        type: string
      check_only:
        default: false
        type: boolean
permissions:
  contents: read
  statuses: read
  pull-requests: read
defaults:
  run:
    shell: bash
concurrency:
  group: feature-isolation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/feature-preview' && !inputs.credential_preflight && (!inputs.modern_stage || inputs.modern_stage == 'none')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - run: npm ci --prefix backend --no-audit --no-fund
      - name: Exact merged approval and credential-free release controls
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPROVAL_PR: ${{ inputs.approval_pr }}
          APPROVAL_MERGE_SHA: ${{ inputs.approval_merge_sha }}
        run: |
          node tools/approved-deployment.mjs feature-check
          node --test --test-reporter=tap backend/tests/jwt-feature-release.test.mjs
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/feature-preview' && !inputs.credential_preflight && !inputs.check_only && vars.FEATURE_DEPLOYMENT_ENABLED == 'true' && (!inputs.modern_stage || inputs.modern_stage == 'none')
    environment: feature
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - run: npm ci --prefix backend --no-audit --no-fund
      - name: Release the reviewed fresh profile, bounded eight requests, owned PAUSED recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPROVAL_PR: ${{ inputs.approval_pr }}
          APPROVAL_MERGE_SHA: ${{ inputs.approval_merge_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_FEATURE_DEPLOY_TOKEN }}
          FEATURE_TEST_ADMIN_PIN: ${{ secrets.FEATURE_TEST_ADMIN_PIN }}
          WRANGLER_SEND_METRICS: "false"
        run: node backend/tools/jwt-feature-deploy.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jwt-feature-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/jwt-release-evidence/deployment.json
            ${{ runner.temp }}/jwt-release-evidence/next-installed-baseline.json
          if-no-files-found: warn
          retention-days: 30

  credential-preflight:
    if: github.ref == 'refs/heads/feature-preview' && inputs.credential_preflight && vars.FEATURE_DEPLOYMENT_ENABLED == 'true' && (!inputs.modern_stage || inputs.modern_stage == 'none')
    environment: feature
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: GET-only existing Feature credential and resource metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_FEATURE_DEPLOY_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: node tools/academy-existing-feature/credential-preflight-v1.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: academy-feature-credential-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/academy-feature-credential-preflight/sanitized.json
          if-no-files-found: error
          retention-days: 30

  modern-release:
    if: github.ref == 'refs/heads/feature-preview' && (inputs.modern_stage == 'upload' || inputs.modern_stage == 'activate') && !inputs.credential_preflight && vars.FEATURE_DEPLOYMENT_ENABLED == 'true'
    environment: feature
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Install pinned deployment tools without lifecycle scripts
        run: npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Fetch only the selected prior staged receipt
        if: inputs.modern_stage == 'activate'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: academy-feature-stage-upload-${{ inputs.upload_run_id }}
          path: ${{ runner.temp }}/academy-feature-staged-input
          run-id: ${{ inputs.upload_run_id }}
          github-token: ${{ github.token }}
      - name: Run exact modern stage with protected Feature credential
        id: release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_FEATURE_DEPLOY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          FEATURE_DEPLOYMENT_ENABLED: ${{ vars.FEATURE_DEPLOYMENT_ENABLED }}
          WRANGLER_SEND_METRICS: 'false'
        run: node tools/academy-existing-feature/release-runner-v1.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: academy-feature-release-status-${{ github.run_id }}
          path: ${{ runner.temp }}/academy-feature-release-evidence/sanitized.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.modern_stage == 'upload' && success()
        with:
          name: academy-feature-stage-upload-${{ github.run_id }}
          path: ${{ runner.temp }}/academy-feature-release-evidence/staged.json
          if-no-files-found: error
          retention-days: 30

  modern-diagnose:
    if: github.ref == 'refs/heads/feature-preview' && inputs.modern_stage == 'diagnose' && !inputs.credential_preflight && vars.FEATURE_DEPLOYMENT_ENABLED == 'true'
    environment: feature
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Read-only same-token coordinator preflight diagnosis
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_FEATURE_DEPLOY_TOKEN }}
          FEATURE_DEPLOYMENT_ENABLED: ${{ vars.FEATURE_DEPLOYMENT_ENABLED }}
        run: node tools/academy-existing-feature/hosted-readonly-diagnostic-v1.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: academy-feature-hosted-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/academy-feature-hosted-diagnostic/sanitized.json
          if-no-files-found: warn
          retention-days: 30
