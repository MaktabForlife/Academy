name: Public homepage design review
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homepage-design-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Install pinned project dependencies
        run: npm ci --prefix backend --no-audit --no-fund
      - name: Check public modules and existing native portal boundaries
        run: |
          node --check tools/homepage-review-check.mjs
          node --check portal/circles/homepage-review.mjs
          node --check portal/circles/homepage-review-data.mjs
          node --check portal/circles-home-entry.mjs
          node --check portal/circles-login.mjs
          node --test backend/tests/portal-hosting.test.mjs backend/tests/academy-circles-native.test.mjs backend/tests/academy-circles-native-join.test.mjs backend/tests/academy-circles-free-join.test.mjs backend/tests/academy-hifz-handoff.test.mjs backend/tests/academy-hifz-bridge-ui.test.mjs
          git diff --check
      - name: Build actual Academy Pages assets without deployment
        run: node backend/tools/academy-pages-build.mjs
      - name: Install isolated browser checker on the runner
        env:
          REVIEW_BROWSER_MODULES: ${{ runner.temp }}/academy-ui-browser
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/academy-ui-browsers
        run: |
          npm install --prefix "$REVIEW_BROWSER_MODULES" --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          node "$REVIEW_BROWSER_MODULES/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Review interaction, accessibility and responsive layout with synthetic data
        env:
          REVIEW_BROWSER_MODULES: ${{ runner.temp }}/academy-ui-browser
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/academy-ui-browsers
        run: node tools/homepage-review-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: homepage-design-review-${{ github.run_id }}
          path: |
            .academy-pages/
            ${{ runner.temp }}/homepage-review-evidence/
          retention-days: 14
