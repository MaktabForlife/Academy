name: Isolated Feature preparation
on:
  create:
  push:
    branches: [feature-preview]
  workflow_dispatch:
    inputs:
      activate_isolated_feature:
        description: Deploy Feature preview and verify at most six API and two page requests
        type: boolean
        default: false
      measure_local_budget:
        description: Measure the native smoke flow using only disposable local databases
        type: boolean
        default: false
      prepare_first_setup:
        description: Read approved Feature control-plane metadata only
        type: boolean
        default: false
      install_isolated_paused:
        description: First installation of the exact new Feature bindings, retaining PAUSED
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: feature-isolation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  schema:
    if: (github.event_name == 'workflow_dispatch' && !inputs.measure_local_budget) || github.ref == 'refs/heads/feature-preview' || startsWith(github.ref, 'refs/heads/validation/feature-isolation-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - run: npm ci --prefix backend --no-audit --no-fund
      - name: Existing management fix and release labels
        run: |
          mkdir -p "$RUNNER_TEMP/feature-evidence"
          node --test --test-reporter=tap --test-concurrency=1 backend/tests/academy-management-origin-regression.test.mjs backend/tests/academy-release-labels.test.mjs backend/tests/portal-hosting.test.mjs 2>&1 | tee "$RUNNER_TEMP/feature-evidence/management.log"
      - name: Reconstruct current schema using synthetic references only
        run: |
          node backend/tools/feature-schema-proof.mjs "$RUNNER_TEMP/feature-schema" 2>&1 | tee "$RUNNER_TEMP/feature-schema.log"
          git diff --check
          git diff --exit-code
      - name: Import exact generated schemas into disposable local D1
        working-directory: backend
        run: |
          npx --no-install wrangler d1 execute ACADEMY_DB --local --config wrangler.feature.jsonc --persist-to "$RUNNER_TEMP/feature-d1" --file "$RUNNER_TEMP/feature-schema/core-schema.sql" --json > "$RUNNER_TEMP/feature-evidence/core-local-import.json"
          npx --no-install wrangler d1 execute ACADEMY_ADMIN_DB --local --config wrangler.feature.jsonc --persist-to "$RUNNER_TEMP/feature-d1" --file "$RUNNER_TEMP/feature-schema/admin-schema.sql" --json > "$RUNNER_TEMP/feature-evidence/admin-local-import.json"
          for binding in ACADEMY_DB ACADEMY_ADMIN_DB; do
            npx --no-install wrangler d1 execute "$binding" --local --config wrangler.feature.jsonc --persist-to "$RUNNER_TEMP/feature-d1" --command "PRAGMA foreign_key_check; PRAGMA quick_check;" --json > "$RUNNER_TEMP/feature-evidence/$binding-local-check.json"
          done
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';import assert from 'node:assert/strict';
          for(const binding of ['ACADEMY_DB','ACADEMY_ADMIN_DB']){
            const result=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/feature-evidence/'+binding+'-local-check.json','utf8'));
            assert.equal(result.length,2);assert.deepEqual(result[0].results,[]);assert.deepEqual(result[1].results,[{quick_check:'ok'}]);
          }
          console.log('Both exact schema files import into disposable local D1; references and integrity pass.');
          NODE
      - name: Select the reviewed Feature build variant and test isolation
        run: |
          node backend/tools/feature-hosting-overlay.mjs "$RUNNER_TEMP/feature-evidence"
          node --test --test-reporter=tap backend/tests/feature-isolation.test.mjs backend/tests/feature-deployment-gates.test.mjs backend/tests/academy-management-origin-regression.test.mjs 2>&1 | tee "$RUNNER_TEMP/feature-evidence/isolation.log"
          node --test --test-reporter=tap --test-concurrency=1 backend/tests/feature-native-initialisation.test.mjs backend/tests/feature-first-preflight.test.mjs backend/tests/feature-seed-encrypt.test.mjs backend/tests/feature-initialise-paused.test.mjs 2>&1 | tee "$RUNNER_TEMP/feature-evidence/native-initialisation.log"
          CF_PAGES_BRANCH=feature-preview node backend/tools/academy-pages-build.mjs 2>&1 | tee "$RUNNER_TEMP/feature-evidence/pages-build.log"
          node --test --test-reporter=tap backend/tests/feature-pages-marker.test.mjs 2>&1 | tee "$RUNNER_TEMP/feature-evidence/pages-marker.log"
          test "$(git diff --name-only)" = "config/hosting.json"
      - name: Validate Feature Worker configurations without Cloudflare access
        working-directory: backend
        run: |
          npx --no-install wrangler deploy --dry-run --config wrangler.feature-coordinator.jsonc --outdir "$RUNNER_TEMP/feature-coordinator-bundle"
          npx --no-install wrangler deploy --dry-run --config wrangler.feature.jsonc --outdir "$RUNNER_TEMP/feature-worker-bundle"
          npx --no-install wrangler types "$RUNNER_TEMP/feature-worker-env.d.ts" --config wrangler.feature.jsonc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: feature-schema-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/feature-schema/
            ${{ runner.temp }}/feature-schema.log
            ${{ runner.temp }}/feature-evidence/
          retention-days: 30
  deploy:
    needs: schema
    if: github.ref == 'refs/heads/feature-preview' && vars.FEATURE_DEPLOYMENT_ENABLED == 'true'
    environment: feature
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - run: npm ci --prefix backend --no-audit --no-fund
      - name: Build only the explicit Feature variant
        run: |
          node backend/tools/feature-hosting-overlay.mjs "$RUNNER_TEMP/feature-deploy-evidence"
          CF_PAGES_BRANCH=feature-preview node backend/tools/academy-pages-build.mjs
          test "$(git diff --name-only)" = "config/hosting.json"
      - name: Deploy verified isolated Feature only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_FEATURE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c9a3e355b3d7a795880b1d36a1dbe123
          GITHUB_TOKEN: ${{ github.token }}
          FEATURE_EVIDENCE: ${{ runner.temp }}/feature-deploy-evidence
        run: node backend/tools/feature-deploy.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: feature-deployment-${{ github.run_id }}
          path: ${{ runner.temp }}/feature-deploy-evidence/
          retention-days: 30

  first-setup-evidence:
    needs: schema
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature-preview' && inputs.prepare_first_setup
    environment: feature
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - run: npm ci --prefix backend --no-audit --no-fund
      - name: Read approved Feature control-plane metadata only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_FEATURE_DEPLOY_TOKEN }}
        run: node backend/tools/feature-first-preflight.mjs "$RUNNER_TEMP/feature-first-metadata"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: feature-first-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/feature-first-metadata/
          retention-days: 7

  install-isolated-paused:
    needs: schema
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature-preview' && inputs.install_isolated_paused
    environment: feature
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - run: npm ci --prefix backend --no-audit --no-fund
      - name: Select only the reviewed Feature build
        run: node backend/tools/feature-hosting-overlay.mjs "$RUNNER_TEMP/feature-first-install"
      - name: Install the exact isolated configuration, keeping Feature paused
        env:
          FEATURE_INITIALISE_ACTION: install-paused
          FEATURE_EVIDENCE: ${{ runner.temp }}/feature-first-install
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_FEATURE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c9a3e355b3d7a795880b1d36a1dbe123
          GITHUB_TOKEN: ${{ github.token }}
          PIN_SECRET: ${{ secrets.PIN_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SHARED_PIN_SECRET: ${{ secrets.SHARED_PIN_SECRET }}
          ACADEMY_OPEN_LIBRARY_STORAGE_KEY: ${{ secrets.ACADEMY_OPEN_LIBRARY_STORAGE_KEY }}
        run: node backend/tools/feature-initialise-paused.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: feature-first-install-${{ github.run_id }}
          path: ${{ runner.temp }}/feature-first-install/
          retention-days: 30

  local-budget:
    if: (github.event_name == 'workflow_dispatch' && inputs.measure_local_budget) || startsWith(github.ref, 'refs/heads/validation/feature-budget-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - run: npm ci --prefix backend --no-audit --no-fund
      - run: node backend/tools/feature-hosting-overlay.mjs "${{ runner.temp }}/feature-local-budget"
      - name: Measure only disposable native runtime
        env:
          FEATURE_BUDGET_EVIDENCE: ${{ runner.temp }}/feature-local-budget
        run: |
          set -o pipefail
          mkdir -p "$FEATURE_BUDGET_EVIDENCE"
          npm install --prefix "$RUNNER_TEMP/feature-budget-runtime" --no-save --package-lock=false --no-audit --no-fund miniflare@5.20261103.0-beta workerd@1.20261103.1
          export FEATURE_MF_ROOT="$RUNNER_TEMP/feature-budget-runtime"
          node --check backend/tools/feature-initial-activate.mjs
          node --test --test-reporter=tap backend/tests/feature-local-budget.test.mjs backend/tests/feature-bounded-smoke.test.mjs 2>&1 | tee "$FEATURE_BUDGET_EVIDENCE/local-budget.log"
          test "$(git diff --name-only)" = "config/hosting.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: feature-local-budget-${{ github.run_id }}
          path: ${{ runner.temp }}/feature-local-budget/
          retention-days: 30

  activate-isolated-feature:
    needs: schema
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature-preview' && inputs.activate_isolated_feature
    environment: feature
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - run: npm ci --prefix backend --no-audit --no-fund
      - name: Build only the reviewed Feature Pages variant
        run: |
          node backend/tools/feature-hosting-overlay.mjs "${{ runner.temp }}/feature-initial-activation"
          CF_PAGES_BRANCH=feature-preview node backend/tools/academy-pages-build.mjs
          test "$(git diff --name-only)" = "config/hosting.json"
          node --test --test-reporter=tap backend/tests/feature-bounded-smoke.test.mjs backend/tests/feature-pages-marker.test.mjs
      - name: Activate only isolated Feature and perform the fixed-budget check
        env:
          FEATURE_INITIALISE_ACTION: activate-bounded
          FEATURE_HOSTED_BUDGET_PROFILE: six-worker-two-pages
          FEATURE_EVIDENCE: ${{ runner.temp }}/feature-initial-activation
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_FEATURE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c9a3e355b3d7a795880b1d36a1dbe123
          GITHUB_TOKEN: ${{ github.token }}
          FEATURE_TEST_ADMIN_PIN: ${{ secrets.FEATURE_TEST_ADMIN_PIN }}
          WRANGLER_SEND_METRICS: "false"
        run: node backend/tools/feature-initial-activate.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: feature-initial-activation-${{ github.run_id }}
          path: ${{ runner.temp }}/feature-initial-activation/
          retention-days: 30
