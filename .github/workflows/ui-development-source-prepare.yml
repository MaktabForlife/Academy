name: Isolated UI Development source preparation
on:
  push:
    branches: [validation/ui-development-composition-20261106]
    paths:
      - .github/workflows/ui-development-source-prepare.yml
      - tools/ui-development-source-prepare.mjs
      - deployment/ui-development-proposal.json
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: ui-development-source-${{ github.repository }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Source build dependencies only; no private environment
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" = "MaktabForlife/Academy" ]; then npm ci --prefix backend --ignore-scripts --no-audit --no-fund; else npm ci --ignore-scripts --no-audit --no-fund; fi
      - name: Compose exact reviewed source, new assets and empty schema proposal
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WRANGLER_SEND_METRICS: "false"
        run: node tools/ui-development-source-prepare.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-development-source-${{ github.run_id }}
          path: ${{ runner.temp }}/ui-development-source-evidence/
          if-no-files-found: error
          retention-days: 30
